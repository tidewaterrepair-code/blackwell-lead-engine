[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leadengine"
version = "0.1.0"
description = "Self-hosted construction lead finder for Hampton Roads, VA"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "jinja2>=3.1",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "apscheduler>=3.10,<4",
  "feedparser>=6.0",
  "beautifulsoup4>=4.12",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.1",
  "pypdf>=4.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
dev = ["pytest>=8"]

[project.scripts]
leadengine = "leadengine.cli:main"

[tool.setuptools.packages.find]
include = ["leadengine*"]

[tool.setuptools.package-data]
leadengine = ["web/templates/*.html", "web/static/*", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
