[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pegasus"
version = "0.1.0"
description = "Pegasus: data & lead technology for the trades and real estate"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "jinja2>=3.1",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "apscheduler>=3.10,<4",
  "feedparser>=6.0",
  "beautifulsoup4>=4.12",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.1",
  "pypdf>=4.0",
  "anthropic>=1.0",
  "stripe>=10",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "cryptography>=42",
  "openpyxl>=3.1",
  "pydantic>=2",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
dev = ["pytest>=8"]

[project.scripts]
pegasus = "pegasus.cli:main"

[tool.setuptools.packages.find]
include = ["pegasus*"]

[tool.setuptools.package-data]
pegasus = ["web/templates/*.html", "web/templates/**/*.html", "web/static/**/*", "data/*.json", "intel/data/*.yaml", "marketing/emails/*.yaml", "migrations/alembic.ini", "migrations/script.py.mako",
           "migrations/*.py", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
