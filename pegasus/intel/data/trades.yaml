# Trade packs: who the customer is and which job tags are leads for them.
# Add a trade by adding a block here. No code change needed.
#
#   group:  trades | realestate
#   tags:   job tags (tags.yaml) that are direct leads for this trade
#   kinds:  optional signal kinds that are always leads (e.g. bids, distress)
#   ticket: typical job size in dollars (used when a signal has no value)

trades:
