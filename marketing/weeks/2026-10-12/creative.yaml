# Week of Oct 12–18, 2026 · launch week · static creative
# Render:  pegasus marketing week --week 2026-10-12   ->  marketing/dist/weeks/2026-10-12/<id>-<size>.png
# Same fields as marketing/banners/copy.yaml. Lead cards are illustrative examples of lead types, not real records.

sizes: [1080x1080, 1080x1350, 1080x1920, 1200x628]

banners:
  # ======================================================== PAID ADS (Meta + LinkedIn + Display)
  - id: w42-ad-morning-drop
    layout: phone
    focus: "40% 50%"
    headline: ["Your 7am", "*just got unfair.*"]
    sub: "Every permit, bid, sale and storm in your area, ranked for your trade before your coffee's done."
    cta: Start free
    cards:
      - {title: New construction, sub: Permit issued, meta: "Ranked #1 for framing"}
      - {title: Room addition, sub: Permit approved, meta: "Your window: next 3 weeks"}
      - {title: Roof replacement, sub: Storm swath, meta: "Hail overnight"}
      - {title: Deck & fence, sub: Predicted, meta: "New home, month 4"}
    features:
      - [hammer, Construction leads]
      - [home, Real estate leads]
      - [file, Permit data]
      - [layers, Predictions]
    sizes: [1080x1080, 1080x1350, 1080x1920, 1200x628, 300x250, 728x90]

  - id: w42-ad-shared-leads
    layout: audience
    ribbon: Contractors
    headline: ["Stop buying", "*shared leads.*"]
    sub: "Find the job at the source: the permit, the plat, the bid. Before three other pros get the same call."
    bullets:
      - [file, Building permits]
      - [map, New subdivisions]
      - [target, Public bids]
      - [cloud, Storm swaths]
    cta: See leads near you
    cta_short: Start free
    sizes: [1080x1080, 1080x1350, 1080x1920, 1200x628, 300x250, 728x90, 160x600]

  - id: w42-ad-expired
    layout: audience
    ribbon: Real estate agents
    headline: ["Expired at midnight.", "*On your list by 7am.*"]
    short: ["Expired at midnight.", "*On your list by 7.*"]
    sub: "Connect your MLS. Expired, withdrawn and cancelled listings in your farm become private leads the moment they change."
    bullets:
      - [tag, Expired & withdrawn listings]
      - [target, Likely-to-sell scores]
      - [home, Off-market properties]
      - [file, Branded market reports]
    cta: Get listing leads
    cta_short: Start free
    sizes: [1080x1080, 1080x1350, 1080x1920, 1200x628, 300x250, 728x90]

  - id: w42-ad-storm
    layout: cards
    kicker: Roofers · siding · gutters
    headline: ["Hail last night?", "*Your map is ready.*"]
    sub: "NOAA hail and wind swaths matched to your area within hours, with the roofs most likely to need you."
    cards:
      - {title: Hail swath, sub: "Reported overnight", meta: Mapped to your area}
      - {title: Roof age 20+ yrs, sub: Inside the swath, meta: Scored by morning}
      - {title: New owner, sub: Bought this year, meta: Ready to call}
    cta: Get storm leads
    sizes: [1080x1080, 1080x1350, 1080x1920, 1200x628]

  - id: w42-ad-founding
    layout: offer
    ribbon: Founding members
    headline: ["First 100 only.", "*40% off for life.*"]
    sub: "Lock the founding price on any plan for as long as you stay. 14 days free, no card."
    stat: {value: "40%", label: "off forever"}
    cta: Claim a seat
    sizes: [1080x1080, 1080x1350, 1080x1920, 1200x628, 300x250, 728x90, 160x600]

  - id: w42-ad-one-job
    layout: offer
    kicker: Do the math
    headline: ["One extra job", "*pays for the year.*"]
    sub: "Plans start at $79 a month. One $12,000 job at a 25% margin is $3,000 profit. Run your own numbers on our site."
    stat: {value: "1", label: "job covers it"}
    cta: Run my numbers
    sizes: [1080x1080, 1080x1350, 1200x628]

