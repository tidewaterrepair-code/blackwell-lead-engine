<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0A08" />
    <link rel="icon" type="image/png" sizes="32x32" href="/static/brand/pegasus-32.png" />
    <link rel="preload" as="image" href="/static/brand/splash.png" />
    <link rel="manifest" href="/static/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png" />
    <title>Pegasus · Leads</title>
    <script>
      try {
        var t = localStorage.getItem("pegasus-theme");
        if (t === "light") document.documentElement.classList.remove("dark");
      } catch (e) {}
    </script>
    <style>
      /* Shown before JavaScript loads; the React splash (components/Splash.tsx) takes over seamlessly. */
      #boot-splash { position: fixed; inset: 0; z-index: 6000; display: grid; place-items: center; background: #050403;
        background-image: radial-gradient(60% 50% at 50% 45%, rgba(226,178,90,0.16), transparent 70%); }
      #boot-splash img { width: min(78vw, 560px); height: auto; animation: boot-in .6s ease-out both; }
      @keyframes boot-in { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { #boot-splash img { animation: none; } }
    </style>
  </head>
  <body class="bg-page text-ink antialiased">
    <div id="boot-splash" aria-hidden="true"><img src="/static/brand/splash.png" alt="" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
